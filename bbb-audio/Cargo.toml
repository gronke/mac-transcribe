[package]
name = "bbb-audio"
version = "0.1.0"
edition = "2021"

[dependencies]
webrtc = "0.12"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
reqwest = { version = "0.12", features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
audiopus = "0.3.0-rc.0"
anyhow = "1"
futures-util = "0.3"
url = "2"
urlencoding = "2"
http = "1"
native-tls = "0.2"
